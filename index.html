<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo crud fetch promise with genric</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <h1 class = "h1 text-center text-white mb-5">2nd TODO CRUD FETCH PROMISE WITH GENRIC</h1>
    <div class = "container">
        <div class = "row">
             <div class = "col-md-8">
                <div class = "card m-5">
                    <h3 class="bg-dark text-center text-white text-white">TODO LIST</h3>
                    <div class = "card-body">
                        <table class = "table table-bordered text-white">
                         <thead>
                            <tr>
                            <th>USER ID</th>
                            <th>TODO NAME</th>
                            <th>EDIT</th>
                            <th>DELETE</th>
                            </tr>
                         </thead>
                         <tbody id = "todoList">
                            <!-- <tr>
                                <td>11</td>
                                <td>js</td>
                                <td><i class = "btn btn-success">Edit</i></td>
                                <td><i class = "btn btn-danger">Remove</i></td>
                            </tr> -->
                         </tbody>
                        </table>
                    </div>
                </div>
            </div>






            <div class = "col-md-4">
                <form id = "todoForm">
                    <div class = "card m-5">
                        <h3 class = "h3 bg-dark text-center">TODO FORM</h3>
                        <div class = "card-body">

                            <div class = "form-group">
                                <label for = "userId">User ID :</label>
                                <input type = "number" class = "form-control mb-3" id = "userId">
                            </div>


                            <div class = "form-group">
                                <label for = "todo">Enter Your Todo :</label>
                                <input type = "text" class = "form-control mb-5" id = "todo">
                            </div>

                            <button type = "submit" class = "btn btn-success" id = "submitBtn">Submit</button> 
                            <button type = "button" class = "btn btn-warning d-none" id = "updateBtn">Update</button>


                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    

       
    <div class="spinner d-none" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only"></span>
            </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src = "app.js"></script>
</body>
</html>
